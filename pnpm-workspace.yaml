allowBuilds:
  '@clerk/shared': true
  '@depot/cli': true
  # Allow Prisma engine download during install (set false to block postinstall scripts)
  '@prisma/engines': true
  bufferutil: false
  core-js: false
  esbuild: true
  msw: true
  # Allow prisma CLI postinstall / generate scripts (set false to block)
  prisma: true
  protobufjs: set this to true or false
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@dagrejs/dagre@3.1.1'
