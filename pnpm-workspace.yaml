allowBuilds:
  '@clerk/shared': true
  # Allow Prisma engine download during install (set false to block postinstall scripts)
  '@prisma/engines': true
  bufferutil: false
  core-js: false
  msw: true
  # Allow prisma CLI postinstall / generate scripts (set false to block)
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
